name: Actualizar precios de La Junta

on:
  push:
    branches: [main]
    paths:
      - 'pricing/**'
      - '.github/workflows/update-prices.yml'
  workflow_dispatch:
  schedule:
    # UTC. Evita el minuto cero; GitHub puede retrasar las ejecuciones.
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: la-junta-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar la rama principal
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consultar API y extracción HTML alternativa
        id: sync
        shell: bash
        run: |
          set +e
          python pricing/sync_prices.py
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::Actualización parcial: revisa dist/prices.json. Se conservan las fechas anteriores."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Registrar cobertura de la consulta
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('dist/prices.json').read_text())
          data['runUrl'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          payload = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          Path('dist/prices.json').write_text(payload)
          Path('dist/prices-snapshot.js').write_text('globalThis.JuntaPriceSnapshot = ' + payload.replace('<', '\\u003c') + ';\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('## Consulta real de supermercados\n\n| Tienda | Producto | Estado | Fuente / error |\n| --- | --- | --- | --- |\n')
              for sid, store in data['stores'].items():
                  for pid, item in store['products'].items():
                      report.write(f"| {sid} | {pid} | {item['status']} | {item.get('error', item.get('source', ''))} |\n")
          PY
      - name: Publicar los archivos de precios en el repositorio
        id: commit
        shell: bash
        run: |
          git add dist/prices.json dist/prices-snapshot.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar precios consultados y cobertura"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Solicitar despliegue en el hosting (opcional)
        if: steps.commit.outputs.changed == 'true'
        env:
          BUILD_HOOK_URL: ${{ secrets.BUILD_HOOK_URL }}
        shell: bash
        run: |
          if [ -n "$BUILD_HOOK_URL" ]; then
            curl --fail --silent --show-error --max-time 30 --request POST "$BUILD_HOOK_URL" --output /dev/null
          fi
